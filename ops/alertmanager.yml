global:
  resolve_timeout: 5m
  smtp_smarthost: ${SMTP_HOST}
  smtp_from: ${SMTP_FROM}
  smtp_auth_username: ${SMTP_USERNAME}
  smtp_auth_password: ${SMTP_PASSWORD}
  smtp_require_tls: true

route:
  receiver: flowcrm-operator
  group_by:
    - alertname
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: flowcrm-operator
    email_configs:
      - to: ${ALERT_EMAIL}
        send_resolved: true
