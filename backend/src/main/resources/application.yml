spring:
  application:
    name: flowcrm-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/flowcrm}
    username: ${DATABASE_USERNAME:flowcrm}
    password: ${DATABASE_PASSWORD:flowcrm}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  security:
    rate-limit:
      login-attempts: ${AUTH_LOGIN_RATE_LIMIT:10}
      register-attempts: ${AUTH_REGISTER_RATE_LIMIT:5}
      refresh-attempts: ${AUTH_REFRESH_RATE_LIMIT:20}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
    retention:
      audit-days: ${AUDIT_RETENTION_DAYS:90}
      cleanup-cron: ${SECURITY_CLEANUP_CRON:0 0 3 * * *}
  jwt:
    secret: ${JWT_SECRET:flowcrm-secret-key-for-development-change-in-production-min-256-bits}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
