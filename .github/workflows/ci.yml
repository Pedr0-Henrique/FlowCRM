name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flowcrm
          POSTGRES_USER: flowcrm
          POSTGRES_PASSWORD: flowcrm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowcrm -d flowcrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/flowcrm
          DATABASE_DRIVER: org.postgresql.Driver
          DATABASE_USERNAME: flowcrm
          DATABASE_PASSWORD: flowcrm

  deployment-config:
    name: Validate production Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet
      - run: docker compose --env-file .env.production.example --profile monitoring -f docker-compose.prod.yml config --quiet
      - run: docker compose --env-file .env.production.example --profile monitoring -f docker-compose.prod.yml config --format json > production-compose.json
      - name: Validate monitoring services are private and proxy-only
        shell: bash
        run: |
          node <<'NODE'
          const compose = require('./production-compose.json');
          for (const service of ['postgres', 'backend', 'frontend', 'alertmanager']) {
            if (compose.services[service]?.ports?.length) {
              throw new Error(`${service} must not publish host ports`);
            }
          }
          for (const service of ['prometheus', 'grafana']) {
            const ports = compose.services[service]?.ports ?? [];
            if (ports.length === 0 || !ports.every((port) => port.host_ip === '127.0.0.1')) {
              throw new Error(`${service} must bind to loopback only`);
            }
          }
          const attachedNetworks = (service) => {
            const networks = service?.networks;
            return Array.isArray(networks) ? networks : Object.keys(networks ?? {});
          };
          const hasNetwork = (service, expected) => attachedNetworks(service).some((network) =>
            network === expected || network.endsWith(`_${expected}`) || network.endsWith(`-${expected}`)
          );
          const hasOnlyNetworks = (service, expected) => {
            const networks = attachedNetworks(service);
            return networks.length === expected.length && expected.every((network) => hasNetwork(service, network));
          };
          if (!hasOnlyNetworks(compose.services.frontend, ['frontend_edge'])) {
            throw new Error('frontend must only attach to the frontend edge network');
          }
          if (!hasOnlyNetworks(compose.services.caddy, ['frontend_edge', 'api_edge'])) {
            throw new Error('Caddy must connect the isolated frontend and API networks');
          }
          if (!hasOnlyNetworks(compose.services.backend, ['api_edge', 'data', 'monitoring'])) {
            throw new Error('API must be isolated from the frontend and reachable by monitoring');
          }
          NODE
      - run: docker compose --env-file .env.production.example -f docker-compose.prod.yml build backend frontend
